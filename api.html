<!DOCTYPE html>
<html>
<head>
  <title>Internal API</title>
</head>
<body>
  <h2>Internal File API</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");

    if (file) {
      fetch(file)
        .then(r => r.text())
        .then(data => {
          document.body.innerHTML += "<pre>" + data + "</pre>";
        })
        .catch(err => {
          document.body.innerHTML += "<pre>File not found</pre>";
        });
    }
  </script>

</body>
</html>
